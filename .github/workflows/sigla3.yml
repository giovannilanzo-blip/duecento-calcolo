name: sigla-originale-strati
on:
  workflow_dispatch:
    inputs:
      strati:
        description: "Strati ACE-Step da generare, in JSON"
        default: '["tamburi","fiati","campane"]'
jobs:
  demucs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Separazione con Demucs
        run: |
          pip install -q torch==2.7.1 torchaudio==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q demucs soundfile
          python -m demucs -n htdemucs --float32 -o out sigla/sorgente/base-sigla.mp3
          ls -R out
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: tracce-demucs, path: out, retention-days: 7}
  strati:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        strato: ${{ fromJSON(inputs.strati) }}
    env: {HF_HUB_DISABLE_XET: "1", PYTHONUNBUFFERED: "1", ACESTEP_DEVICE: "cpu"}
    steps:
      - name: Spazio su disco e memoria di scambio
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo swapoff -a; sudo rm -f /mnt/swapfile; sudo fallocate -l 10G /mnt/swap2 && sudo chmod 600 /mnt/swap2 && sudo mkswap /mnt/swap2 && sudo swapon /mnt/swap2
          sudo mkdir -p /mnt/ace && sudo chown $USER /mnt/ace; free -h; df -h /mnt
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Installazione di ACE-Step 1.5
        run: |
          git clone --filter=blob:none https://github.com/ace-step/ACE-Step-1.5.git /mnt/ace
          git -C /mnt/ace checkout ca1e85fe9430179831e6bc6be790c332190a3866
          pip install -q torch==2.7.1 torchaudio==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "transformers>=4.51.0,<4.58.0" "diffusers>=0.37.0" scipy soundfile loguru einops "accelerate>=1.12.0" numba \
            "vector-quantize-pytorch>=1.27.15" "torchao>=0.16.0,<0.17.0" toml diskcache matplotlib "peft>=0.18.0" pytorch-wavelets pywavelets \
            "setuptools<72" huggingface_hub modelscope safetensors pyyaml tqdm python-dotenv xxhash typer-slim
      - name: Generazione dello strato
        run: python sigla/strati.py /mnt/ace ${{ matrix.strato }} sigla/sorgente/base-sigla.mp3 108 $GITHUB_WORKSPACE/out 2>&1 | grep -v "audio_code_"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "strato-${{ matrix.strato }}", path: "out/strato-*", if-no-files-found: warn, retention-days: 7}
