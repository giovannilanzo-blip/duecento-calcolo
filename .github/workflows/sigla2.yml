name: sigla-ritocchi
on:
  workflow_dispatch:
    inputs:
      sorgente:
        description: "Run con le prove di partenza (artefatti sigla-A e sigla-C)"
        default: "46043729324"
      lavori:
        description: "Lavori in JSON: lavoro, artefatto di partenza, seme"
        default: '[{"lavoro":"A2","src":"A","seme":2101},{"lavoro":"A2","src":"A","seme":2202},{"lavoro":"C2","src":"C","seme":3101},{"lavoro":"C2","src":"C","seme":3202}]'
jobs:
  ritocca:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions: {actions: read, contents: read}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(inputs.lavori) }}
    env: {HF_HUB_DISABLE_XET: "1", PYTHONUNBUFFERED: "1", ACESTEP_DEVICE: "cpu"}
    steps:
      - name: Spazio su disco e memoria di scambio
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo swapoff -a; sudo rm -f /mnt/swapfile; sudo fallocate -l 10G /mnt/swap2 && sudo chmod 600 /mnt/swap2 && sudo mkswap /mnt/swap2 && sudo swapon /mnt/swap2
          sudo mkdir -p /mnt/ace && sudo chown $USER /mnt/ace; free -h
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: "sigla-${{ matrix.job.src }}", path: src, run-id: "${{ inputs.sorgente }}", github-token: "${{ github.token }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Installazione di ACE-Step 1.5
        run: |
          git clone --filter=blob:none https://github.com/ace-step/ACE-Step-1.5.git /mnt/ace
          git -C /mnt/ace checkout ca1e85fe9430179831e6bc6be790c332190a3866
          pip install -q torch==2.7.1 torchaudio==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "transformers>=4.51.0,<4.58.0" "diffusers>=0.37.0" scipy soundfile loguru einops "accelerate>=1.12.0" numba \
            "vector-quantize-pytorch>=1.27.15" "torchao>=0.16.0,<0.17.0" toml diskcache matplotlib "peft>=0.18.0" pytorch-wavelets pywavelets \
            "setuptools<72" huggingface_hub modelscope safetensors pyyaml tqdm python-dotenv xxhash typer-slim
      - name: Ritocco
        run: python sigla/ritocca.py /mnt/ace ${{ matrix.job.lavoro }} src/sigla-${{ matrix.job.src }}.wav ${{ matrix.job.seme }} $GITHUB_WORKSPACE/out 2>&1 | grep -v "audio_code_"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "sigla-${{ matrix.job.lavoro }}-s${{ matrix.job.seme }}", path: "out/sigla-*", if-no-files-found: warn}
