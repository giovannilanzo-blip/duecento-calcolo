name: campionario-voci-3
on:
  workflow_dispatch:
    inputs:
      testo:
        description: "Frase del campionario"
        default: "Nel milleduecentocinquantasei, nella valle del Serchio, i cavalieri di Lucca e di Firenze caricano la fanteria pisana schierata dietro i pavesi. È la battaglia di Ponte a Serchio, e i Pisani ne escono sconfitti. Ma la guerra tra le città toscane è appena cominciata!"
      voci:
        description: "Voci progettate da generare"
        default: '["F01-autorevole_pacata", "F02-divulgatrice_calda", "F03-giovane_luminosa", "F04-profonda_vellutata", "F05-dolce_ragazzi", "F06-cronista_sobria", "M01-baritono_pacato", "M02-racconto_storico", "M03-giovane_divulgatore", "M04-profonda_solenne"]'
      semi:
        description: "Semi separati da virgola"
        default: "1256,1176"
permissions:
  contents: read
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        voce: ${{ fromJSON(inputs.voci) }}
    env: {TESTO: "${{ inputs.testo }}", HF_HUB_DISABLE_XET: "1", SEMI: "${{ inputs.semi }}", LIMITE: "1200"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Spazio su disco e memoria virtuale
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo swapoff -a; sudo fallocate -l 8G /mnt/sw && sudo chmod 600 /mnt/sw && sudo mkswap /mnt/sw && sudo swapon /mnt/sw
      - name: Installazione
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q qwen-tts soundfile --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Generazione
        run: python voce/campione3.py ${{ matrix.voce }} out
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "c3-${{ matrix.voce }}", path: out, if-no-files-found: warn}
  verifica:
    needs: gen
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: "c3-*", path: tutti}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Banda, fruscio e lingua
        run: |
          pip install -q numpy faster-whisper
          python voce/banda.py tutti
          WHISPER=medium python voce/lingua3.py tutti
      - uses: actions/upload-artifact@v4
        with:
          name: verifica-campionario-3
          path: tutti/*.json
