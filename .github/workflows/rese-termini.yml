name: rese-termini
# Volo su Termini (video «Duecento»): ogni lavoro costruisce la scena dagli script del ramo indicato (geometria e materiali
# tutti procedurali), aggiunge la camera della variante scelta e rende con EEVEE in software (Mesa llvmpipe sotto Xvfb).
# Un lavoro a parte rende la tavola dei fotogrammi chiave a metà risoluzione; gli altri rendono intervalli di fotogrammi.
on:
  workflow_dispatch:
    inputs:
      ramo:
        description: "Ramo con gli script"
        default: "rese-termini"
      variante:
        description: "Variante del percorso (percorso2.py)"
        default: "C"
      inizio:
        description: "Primo fotogramma"
        default: "0"
      fine:
        description: "Ultimo fotogramma"
        default: "865"
      lavori:
        description: "Numero di lavori di resa in parallelo"
        default: "12"
      tavola:
        description: "Fotogrammi della tavola (vuoto = niente tavola)"
        default: "45,150,330,400,560,680,750,860"
      campioni:
        description: "Campioni EEVEE della resa"
        default: "32"
jobs:
  prepara:
    runs-on: ubuntu-latest
    outputs:
      blocchi: ${{ steps.m.outputs.blocchi }}
    steps:
      - id: m
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, math
          a, b, n = int("${{ inputs.inizio }}"), int("${{ inputs.fine }}"), int("${{ inputs.lavori }}")
          tav = "${{ inputs.tavola }}".strip()
          tot = b - a + 1; k = math.ceil(tot / n) if n > 0 else 0
          bl = [{"i": str(i), "a": a + i * k, "b": min(b, a + (i + 1) * k - 1), "t": ""} for i in range(n) if a + i * k <= b]
          if tav:
              bl.insert(0, {"i": "tavola", "a": 0, "b": 0, "t": tav})
          print("blocchi=" + json.dumps(bl))
          EOF
  rendi:
    needs: prepara
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        blocco: ${{ fromJson(needs.prepara.outputs.blocchi) }}
    env:
      TE_VARIANTE: ${{ inputs.variante }}
      TE_SAMPLES: ${{ inputs.campioni }}
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ramo }}
      - name: Librerie grafiche in software
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 libegl-mesa0 libglx-mesa0 libxi6 libxkbcommon0 libxkbcommon-x11-0 libxrender1 libsm6 libxxf86vm1 libxfixes3 libxinerama1 libxcursor1 libxrandr2 > /dev/null
          nproc; free -h
      - name: Cache di Blender
        uses: actions/cache@v4
        with:
          path: blender
          key: blender-4.5-linux-v1
      - name: Blender 4.5 per Linux
        run: |
          if [ ! -x blender/blender ]; then
            V=$(curl -s https://download.blender.org/release/Blender4.5/ | grep -o 'blender-4\.5\.[0-9]*-linux-x64\.tar\.xz' | sort -V | tail -1)
            echo "versione: $V"
            curl -sSL -o b.tar.xz "https://download.blender.org/release/Blender4.5/$V"
            mkdir blender && tar -xf b.tar.xz -C blender --strip-components=1
          fi
          blender/blender --version | head -1
      - name: Costruzione della scena e della camera
        run: |
          S=termini/video/termini/scripts
          xvfb-run -a -s "-screen 0 1920x1080x24" blender/blender -b -t 4 --factory-startup -P $S/termini.py -- --build 2>&1 | grep -E "SALVATO|acquedotto|scalo|case |Error|Traceback|rror:|line [0-9]" || true
          xvfb-run -a -s "-screen 0 1920x1080x24" blender/blender -b -t 4 termini/video/termini/termini.blend -P $S/volo2.py -- --camera 2>&1 | grep -E "SALVATO|lunghezza|Error|Traceback|rror:|line [0-9]" || true
          ls -la termini/video/termini/*.blend
      - name: Resa
        run: |
          S=termini/video/termini/scripts
          mkdir -p out
          if [ -n "${{ matrix.blocco.t }}" ]; then
            ARG="--frames ${{ matrix.blocco.t }} --pct 50"
          else
            ARG="--render ${{ matrix.blocco.a }} ${{ matrix.blocco.b }}"
          fi
          xvfb-run -a -s "-screen 0 1920x1080x24" blender/blender -b -t 4 termini/video/termini/termini_volo2.blend -P $S/volo2.py -- $ARG --out "$PWD/out" 2>&1 | grep -E "RESO|RESI|Fra:.*Time|Error|Traceback|rror:|line [0-9]" | tail -40 || true
          ls out | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: termini-${{ matrix.blocco.i }}
          path: out/
          retention-days: 3
