name: audio-liberi
on:
  workflow_dispatch:
    inputs:
      lavoro:
        description: "audiogen, voce, musica oppure tutto"
        default: "tutto"
      frasi:
        description: "Frasi italiane in formato JSON"
        default: '["Nel 1256 Lucca e Firenze sconfiggono Pisa a Ponte a Serchio.", "I mercanti della Vucciria vendono pesce, frutta e spezie."]'
      solo:
        description: "Parti di AudioGen da eseguire, per esempio video-1,gioco-0 (vuoto significa tutte)"
        default: ""
      sorgente:
        description: "Numero del run con le voci da valutare"
        default: ""
      musica:
        description: "Testo per la prova musicale"
        default: "medieval instrumental estampie, tabor drum, wooden recorder flute, vielle fiddle, hurdy-gurdy drone, acoustic early music ensemble"
jobs:
  audiogen:
    if: inputs.lavoro == 'audiogen' || inputs.lavoro == 'tutto'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lista: video, durata: 10, parte: 0, parti: 1}
          - {lista: gioco, durata: 8, parte: 0, parti: 1}
    env: {HF_HUB_DISABLE_XET: "1", GRUPPO: "1", LIMITE_MIN: "20", PYTHONUNBUFFERED: "1"}
    steps:
      - name: Spazio su disco
        if: inputs.solo == '' || contains(inputs.solo, format('{0}-{1}', matrix.lista, matrix.parte))
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost; df -h / /mnt
      - uses: actions/checkout@v4
        if: inputs.solo == '' || contains(inputs.solo, format('{0}-{1}', matrix.lista, matrix.parte))
      - uses: actions/setup-python@v5
        if: inputs.solo == '' || contains(inputs.solo, format('{0}-{1}', matrix.lista, matrix.parte))
        with: {python-version: "3.10"}
      - name: Memoria di scambio
        if: inputs.solo == '' || contains(inputs.solo, format('{0}-{1}', matrix.lista, matrix.parte))
        run: sudo swapoff -a; sudo rm -f /mnt/swapfile; sudo fallocate -l 8G /mnt/swap2 && sudo chmod 600 /mnt/swap2 && sudo mkswap /mnt/swap2 && sudo swapon /mnt/swap2; free -h; df -h / /mnt
      - name: Installazione
        if: inputs.solo == '' || contains(inputs.solo, format('{0}-{1}', matrix.lista, matrix.parte))
        run: |
          pip install -q torch==2.1.0 torchaudio==2.1.0 torchvision==0.16.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "av<13" --only-binary=:all:
          pip install -q "numpy<2" einops flashy "hydra-core>=1.1" hydra_colorlog julius num2words sentencepiece "spacy==3.7.6" "transformers==4.40.2" huggingface_hub tqdm librosa soundfile torchmetrics encodec protobuf demucs torchdiffeq click "typer<0.13"
          pip install -q "xformers==0.0.22.post7" --no-deps
          pip install -q audiocraft==1.3.0 --no-deps
          python -c "from audiocraft.models import AudioGen; print('audiocraft pronto')"
      - name: Generazione
        if: inputs.solo == '' || contains(inputs.solo, format('{0}-{1}', matrix.lista, matrix.parte))
        run: python audio/gen_audiogen.py audio/${{ matrix.lista }}.json ${{ matrix.durata }} ${{ matrix.parte }} ${{ matrix.parti }} out
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.solo == '' || contains(inputs.solo, format('{0}-{1}', matrix.lista, matrix.parte)))
        with: {name: "audiogen-${{ matrix.lista }}-${{ matrix.parte }}", path: out, if-no-files-found: warn}
  chatterbox:
    if: inputs.lavoro == 'voce' || inputs.lavoro == 'tutto'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Installazione
        run: pip install -q chatterbox-tts --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Generazione
        env: {FRASI: "${{ inputs.frasi }}"}
        run: python audio/gen_chatterbox.py out
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: voce-chatterbox, path: out, if-no-files-found: warn}
  moss-nano:
    if: inputs.lavoro == 'voce' || inputs.lavoro == 'tutto'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Installazione
        run: |
          git clone --depth 1 https://github.com/OpenMOSS/MOSS-TTS-Nano nano
          cd nano
          pip install -q pynini==2.1.6.post1 || pip install -q pynini
          pip install -q torch==2.7.0 torchaudio==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -q -e . --no-deps
      - name: Generazione
        env: {FRASI: "${{ inputs.frasi }}"}
        run: |
          cd nano; mkdir -p ../out
          python - <<'PY'
          import json, os, subprocess, glob
          frasi = json.loads(os.environ["FRASI"])
          def gira(v, i, f):
              r = subprocess.run(["python", "infer_onnx.py", "--text", f, "--voice", v, "--cpu-threads", "2",
                                  "--output-audio-path", f"../out/moss-nano-{v}-frase{i}.wav"])
              print(v, i, r.returncode, flush=True)
          gira("Junhao", 1, frasi[0])
          voci = []
          for j in glob.glob("**/*.json", recursive=True):
              try:
                  d = json.load(open(j, encoding="utf-8"))
              except Exception:
                  continue
              if isinstance(d, dict) and "builtin_voices" in d:
                  voci = [x.get("voice") or x.get("name") for x in d["builtin_voices"]]
                  print("VOCI", j, [{k: v for k, v in x.items() if k != "prompt_audio_codes"} for x in d["builtin_voices"]], flush=True)
          scelte = [v for v in voci if v and v != "Junhao"][:3]
          for v in ["Junhao"] + scelte:
              for i, f in enumerate(frasi, 1):
                  if v == "Junhao" and i == 1:
                      continue
                  gira(v, i, f)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: voce-moss-nano, path: out, if-no-files-found: warn}
  musica:
    if: inputs.lavoro == 'musica' || inputs.lavoro == 'tutto'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Installazione
        run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q transformers scipy
      - name: Generazione
        env: {TESTO_MUSICA: "${{ inputs.musica }}"}
        run: python audio/gen_musicgen.py out
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: musica-musicgen, path: out, if-no-files-found: warn}
  valuta:
    if: inputs.lavoro == 'valuta'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: {actions: read, contents: read}
    steps:
      - uses: actions/download-artifact@v4
        with: {run-id: "${{ inputs.sorgente }}", github-token: "${{ github.token }}", path: voci, pattern: "voce-*"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Installazione di MOSS-TTS-Nano
        run: |
          git clone --depth 1 https://github.com/OpenMOSS/MOSS-TTS-Nano nano
          cd nano
          pip install -q pynini==2.1.6.post1 || pip install -q pynini
          pip install -q torch==2.7.0 torchaudio==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -q -e . --no-deps
      - name: MOSS-TTS-Nano con la voce sintetica di Chatterbox come riferimento
        env: {FRASI: "${{ inputs.frasi }}"}
        run: |
          cd nano; mkdir -p ../voci/voce-moss-nano-clone
          python - <<'PY'
          import json, os, subprocess
          frasi = json.loads(os.environ["FRASI"]) + ["Nel milleduecentocinquantasei Lucca e Firenze sconfiggono Pisa a Ponte a Serchio."]
          for i, f in enumerate(frasi, 1):
              subprocess.run(["python", "infer_onnx.py", "--text", f, "--prompt-audio-path", "../voci/voce-chatterbox/chatterbox-frase2.wav",
                              "--cpu-threads", "2", "--output-audio-path", f"../voci/voce-moss-nano-clone/moss-nano-voceChatterbox-frase{i}.wav"])
          PY
      - name: Trascrizione di controllo con Whisper
        run: |
          pip install -q faster-whisper
          python - <<'PY'
          import glob
          from faster_whisper import WhisperModel
          m = WhisperModel("small", device="cpu", compute_type="int8")
          with open("voci/trascrizioni.txt", "w", encoding="utf-8") as out:
              for f in sorted(glob.glob("voci/**/*.wav", recursive=True)):
                  seg, _ = m.transcribe(f, language="it", beam_size=5)
                  t = " ".join(s.text.strip() for s in seg)
                  print(f, "=>", t, flush=True); print(f, "|", t, file=out)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: valutazione-voci, path: voci}
